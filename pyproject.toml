[project]
name = "fit-pcsaft"
version = "0.1.0"
description = "A Python package for fitting the PC-SAFT equation of state to experimental data."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
authors = [{ name = "Maximilian Fleckenstein", email = "maximilianfv@uc.cl" }]
dependencies = [
  "feos>=0.10.1",
  "matplotlib>=3.10.8",
  "polars>=1.38.1",
  "pubchempy==1.0.5",
  "pymoo>=0.6.2",
  "scipy>=1.17.0",
  "seaborn>=0.13.2",
  "si-units>=0.11.1",
]

[tool.uv.sources]
# Locally-optimized feos build (full LTO + -Ctarget-cpu=native, Cargo features
# trimmed to pcsaft/dft/multiparameter/ad/rayon), produced by TESIS'
# bin/build-feos-wheel. Same version as PyPI's, different bytes. The marker
# scopes it to this Mac: the Linux/Intel machine's sys_platform and
# platform_machine both miss and it falls back to PyPI there, untouched.
feos = [
    { path = "../feos/dist/feos-0.10.1-cp310-abi3-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "tqdm>=4.69.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
